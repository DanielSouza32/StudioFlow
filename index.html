[data-tipo=neutro]:not([data-tema=escuro]){--fundo:#F4EEE6;--painel:#FFFDF9;--painel2:#EFE6DA;--borda:#E4D8C8;--texto:#1F1A1C;--suave:#6F6466;--preto:#1F1A1C;--preto2:#2E2530;--vermelho-poste:#5B2E6E;--azul-poste:#B58BC8;--cinza:#8A7F80;--listras:linear-gradient(90deg,#5B2E6E,#B58BC8,#5B2E6E);--sombra:0 1px 2px #1f1a1c0d,0 10px 28px -14px #1f1a1c33}
[data-tipo=neutro] h1,[data-tipo=neutro] h2,[data-tipo=neutro] h3,[data-tipo=neutro] .marca{font-family:'Bodoni Moda',Didot,Georgia,serif;font-weight:500;letter-spacing:0}
[data-tipo=neutro] .btn{border-radius:999px}
[data-tipo=neutro] .btn:hover{background:#47215A;border-color:#47215A}
[data-tipo=neutro] .btn.sec:hover{background:#EFE6DA;border-color:#5B2E6E}
[data-tipo=neutro] .abas .btn:not(.sec){background:#1F1A1C;border-color:#1F1A1C}
[data-tipo=neutro] .faixa-poste{background:linear-gradient(90deg,#5B2E6E,#B58BC8,#5B2E6E);animation:none;height:3px}
[data-tipo=neutro] .login-foto{background-image:none!important;background:#1F1A1C}
[data-tipo=neutro] .login-foto:before{background:radial-gradient(90% 60% at 85% 10%,#5B2E6E66 0%,transparent 60%),radial-gradient(80% 60% at 0% 100%,#B58BC833 0%,transparent 55%)}
[data-tipo=neutro] .marca b{color:#C9A6DA}
[data-tipo=neutro] .lateral{background:#1F1A1C}
[data-tipo=neutro] .nav-item.ativo{background:#5B2E6E;color:#fff}
[data-tipo=neutro] .kpi:before,[data-tipo=neutro] .nav-item.ativo:before{background:linear-gradient(180deg,#5B2E6E,#B58BC8)}
[data-tipo=neutro] .avatar{background:#5B2E6E}
[data-tipo=neutro] .escolha.sel{border-color:#5B2E6E;box-shadow:0 0 0 3px #5B2E6E22}
[data-tipo=neutro] .sf-logo rect{fill:#1F1A1C}
[data-tipo=neutro] .sf-logo path{stroke:#F4EEE6}
[data-tipo=neutro] .sf-logo path:last-of-type{stroke:#B58BC8}
[data-tipo=neutro] .sf-logo circle{fill:#B58BC8}
[data-tipo=neutro] .login-foto .sf-logo{box-shadow:0 0 0 1px #F4EEE622;border-radius:22%}
[data-tipo=neutro] input:focus,[data-tipo=neutro] select:focus,[data-tipo=neutro] textarea:focus{outline-color:#5B2E6E}
[data-tipo=salao] .escolha.sel{border-color:#7B3A96;box-shadow:0 0 0 3px #7B3A9622}
[data-tipo=salao] .aviso-plano.info,[data-tipo=neutro] .aviso-plano.info{background:#F6EEF7;border-color:#E3CDEA;color:var(--texto)}
[data-tipo=salao] .login-foto{background-position:center 35%}
/* ===== assistente financeiro ===== */
.sf-chat{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:58vh;overflow:auto}
.sf-chat-vazio{margin:auto;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sf-msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5}
.sf-msg.eu{align-self:flex-end;background:var(--vermelho-poste);color:#fff;border-bottom-right-radius:4px}
.sf-msg.ia{align-self:flex-start;background:var(--painel2);border:1px solid var(--borda);border-bottom-left-radius:4px}
.sf-pensando{color:var(--suave);font-style:italic}
.sf-texto-ia p{margin:0 0 6px}.sf-texto-ia ul{margin:2px 0 8px;padding-left:18px}.sf-texto-ia li{margin:2px 0}
.sf-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sf-chat-form{gap:8px;flex-wrap:nowrap;margin-bottom:6px}.sf-chat-form input{flex:1}
/* ===== Google e venda rápida ===== */
.sf-google{margin-top:12px;display:inline-flex}
.sf-google-cfg{margin:12px 0}
.sf-vr-lista{display:flex;flex-wrap:wrap;gap:6px}
